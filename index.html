<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATAVA Ultimate Highway Racer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #111;
            box-shadow: 0 0 30px rgba(255, 51, 0, 0.5);
        }

        .hud {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.9); color: #fff; font-weight: bold;
            border-bottom: 3px solid #ff3300; z-index: 10; backdrop-filter: blur(8px);
        }

        .hud span { color: #f59e0b; font-size: 1.1rem; }

        .speed-box {
            display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5);
            padding: 4px 10px; border-radius: 20px; border: 1px solid #ff3300;
        }

        .spd-btn {
            background: #ff3300; border: none; color: white; width: 26px; height: 26px;
            border-radius: 50%; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            padding: 0 30px; box-sizing: border-box; z-index: 10;
        }

        .btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            color: white; font-size: 2.2rem; display: flex; align-items: center;
            justify-content: center; backdrop-filter: blur(6px); user-select: none;
            cursor: pointer;
        }

        .menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.96); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: white;
            padding: 20px; text-align: center;
        }

        .menu h1 { color: #ff3300; font-size: 2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,51,0,0.5); }
        .menu p { color: #94a3b8; margin-bottom: 25px; }

        .vehicle-select {
            display: flex; gap: 15px; margin-bottom: 25px;
        }

        .select-btn {
            background: #1e293b; border: 2px solid #334155; color: white;
            padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer;
            font-size: 1rem; transition: all 0.3s;
        }

        .select-btn.active {
            border-color: #ff3300; background: #ff330022; color: #ff3300;
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.3);
        }

        .start-btn {
            background: linear-gradient(45deg, #ff3300, #ffaa00); border: none;
            color: white; padding: 16px 45px; font-size: 1.25rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 51, 0, 0.4);
        }

        .footer { margin-top: 35px; font-size: 0.85rem; color: #ffaa00; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>COINS: <span id="coins">0</span></div>
        <div class="speed-box">
            <button class="spd-btn" onclick="adjustSpeed(-2)">-</button>
            <span id="speedVal" style="color:#fff; font-size:0.9rem;">120 KM/H</span>
            <button class="spd-btn" onclick="adjustSpeed(2)">+</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="btn" id="leftBtn">◀</div>
        <div class="btn" id="rightBtn">▶</div>
    </div>

    <div class="menu" id="menu">
        <h1 id="menuTitle">ATAVA SPEED RACER</h1>
        <p>Select Your Vehicle & Hit The Road</p>
        
        <div class="vehicle-select">
            <button class="select-btn active" id="btnBike" onclick="setVehicle('bike')">🏍️ SUPERBIKE</button>
            <button class="select-btn" id="btnCar" onclick="setVehicle('car')">🏎️ SPORTS CAR</button>
        </div>

        <button class="start-btn" onclick="startGame()">START RACE 🚀</button>
        <div class="footer">POWERED BY ATAVA DIGITAL SERVICES & TRADING</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight;

        let gameActive = false;
        let score = 0, coins = 0;
        let baseSpeed = 10;
        let selectedVehicle = 'bike';
        let roadOffset = 0;

        const lanes = [
            canvas.width * 0.20,
            canvas.width * 0.40,
            canvas.width * 0.60,
            canvas.width * 0.80
        ];
        let playerLane = 1;

        const player = {
            x: lanes[playerLane],
            y: canvas.height - 150,
            width: 40,
            height: 75
        };

        let traffic = [];
        let coinList = [];
        let popups = [];

        function setVehicle(type) {
            selectedVehicle = type;
            document.getElementById('btnBike').classList.toggle('active', type === 'bike');
            document.getElementById('btnCar').classList.toggle('active', type === 'car');
        }

        function adjustSpeed(val) {
            baseSpeed = Math.max(6, Math.min(22, baseSpeed + val));
            document.getElementById('speedVal').innerText = Math.floor(baseSpeed * 12) + " KM/H";
        }

        function drawRoad() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Side Guards
            const railW = 14;
            const stripeH = 35;
            for (let y = -stripeH + (roadOffset % stripeH); y < canvas.height; y += stripeH) {
                ctx.fillStyle = (Math.floor((y - roadOffset) / stripeH) % 2 === 0) ? '#ef4444' : '#ffffff';
                ctx.fillRect(0, y, railW, stripeH);
                ctx.fillRect(canvas.width - railW, y, railW, stripeH);
            }

            // Yellow Center Lines
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(canvas.width / 2 - 3, 0, 3, canvas.height);
            ctx.fillRect(canvas.width / 2 + 1, 0, 3, canvas.height);

            // Lane Dashes
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.30, 0); ctx.lineTo(canvas.width * 0.30, canvas.height);
            ctx.moveTo(canvas.width * 0.70, 0); ctx.lineTo(canvas.width * 0.70, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayerVehicle() {
            player.x += (lanes[playerLane] - player.x) * 0.25;

            ctx.save();
            ctx.translate(player.x, player.y);

            if (selectedVehicle === 'bike') {
                // HD Superbike
                // Front Light Beam
                ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
                ctx.beginPath(); ctx.arc(0, -35, 22, 0, Math.PI * 2); ctx.fill();

                // Wheels
                ctx.fillStyle = '#000';
                ctx.fillRect(-4, -32, 8, 14);
                ctx.fillRect(-5, 20, 10, 16);

                // Body
                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(0, -28); ctx.lineTo(10, -5); ctx.lineTo(8, 18);
                ctx.lineTo(-8, 18); ctx.lineTo(-10, -5);
                ctx.closePath(); ctx.fill();

                // Handlebars
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(-13, -10, 26, 4);

                // Rider (Helmet & Jacket)
                ctx.fillStyle = '#0f172a'; ctx.fillRect(-10, -2, 20, 12);
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();

                // Exhaust Flame
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(-3, 36, 6, 8 + Math.random() * 4);

            } else {
                // HD Sports Car
                // Car Body Base
                ctx.fillStyle = '#2563eb';
                ctx.beginPath();
                ctx.roundRect(-20, -35, 40, 70, 8);
                ctx.fill();

                // Roof & Windshields
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-15, -16, 30, 14); // Front Glass
                ctx.fillRect(-14, 12, 28, 8);  // Rear Glass

                // Spoiler
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-22, 30, 44, 5);

                // Side Mirrors
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(-23, -15, 4, 8);
                ctx.fillRect(19, -15, 4, 8);

                // Headlights Glow
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(-16, -35, 6, 3);
                ctx.fillRect(10, -35, 6, 3);
            }

            ctx.restore();
        }

        function drawTrafficCar(c) {
            ctx.save();
            ctx.translate(c.x, c.y);

            // Car Paint
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.roundRect(-20, -35, 40, 70, 7);
            ctx.fill();

            // Glass
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-15, -10, 30, 22);

            // Taillights
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-16, 32, 6, 3);
            ctx.fillRect(10, 32, 6, 3);

            ctx.restore();
        }

        function spawnTraffic() {
            if (Math.random() < 0.02) {
                let laneIdx = Math.floor(Math.random() * 4);
                let targetX = lanes[laneIdx];

                // Strict Overlap Prevention: Don't spawn if a car is nearby in the same lane
                let clearLane = true;
                for (let t of traffic) {
                    if (Math.abs(t.x - targetX) < 10 && t.y < 150) {
                        clearLane = false;
                        break;
                    }
                }

                if (clearLane) {
                    traffic.push({
                        x: targetX,
                        y: -100,
                        color: ['#dc2626', '#8b5cf6', '#059669', '#d97706'][Math.floor(Math.random() * 4)],
                        speed: baseSpeed * 0.4 + Math.random() * 1.5
                    });
                }
            }

            // Coins
            if (Math.random() < 0.015) {
                let laneIdx = Math.floor(Math.random() * 4);
                coinList.push({ x: lanes[laneIdx], y: -50 });
            }
        }

        function updateGameObjects() {
            // Traffic Movement & Drawing
            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.y += baseSpeed - t.speed; // Relative realistic speed
                drawTrafficCar(t);

                // Collision
                if (Math.abs(t.x - player.x) < 32 && Math.abs(t.y - player.y) < 60) {
                    gameOver();
                }

                if (t.y > canvas.height + 100) traffic.splice(i, 1);
            }

            // Coin Collect & Render
            for (let i = coinList.length - 1; i >= 0; i--) {
                let coin = coinList[i];
                coin.y += baseSpeed;

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, 11, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                if (Math.abs(coin.x - player.x) < 25 && Math.abs(coin.y - player.y) < 35) {
                    coins += 10;
                    document.getElementById('coins').innerText = coins;
                    
                    // ATAVA Floating Text Animation
                    popups.push({ x: player.x, y: player.y - 20, alpha: 1.0 });
                    coinList.splice(i, 1);
                } else if (coin.y > canvas.height + 50) {
                    coinList.splice(i, 1);
                }
            }

            // ATAVA Popup Text Effect
            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i];
                p.y -= 2.5;
                p.alpha -= 0.035;

                ctx.fillStyle = `rgba(255, 204, 0, ${p.alpha})`;
                ctx.font = 'bold 20px Segoe UI';
                ctx.shadowColor = 'rgba(255, 51, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText('ATAVA +10', p.x - 40, p.y);
                ctx.shadowBlur = 0; // Reset shadow

                if (p.alpha <= 0) popups.splice(i, 1);
            }
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameActive = true;
            score = 0; coins = 0; traffic = []; coinList = []; popups = [];
            document.getElementById('score').innerText = '0';
            document.getElementById('coins').innerText = '0';
            animate();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('menuTitle').innerText = "CRASHED!";
        }

        function animate() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            roadOffset += baseSpeed;
            score += 0.2;
            document.getElementById('score').innerText = Math.floor(score);

            drawRoad();
            drawPlayerVehicle();
            spawnTraffic();
            updateGameObjects();

            requestAnimationFrame(animate);
        }

        // Controls (Touch & Keyboard)
        const moveLeft = () => { if (playerLane > 0) playerLane--; };
        const moveRight = () => { if (playerLane < 3) playerLane++; };

        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });

        document.getElementById('leftBtn').addEventListener('click', moveLeft);
        document.getElementById('rightBtn').addEventListener('click', moveRight);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });
    </script>
</body>
</html>
