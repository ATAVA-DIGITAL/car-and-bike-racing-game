<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATAVA Digital Services - Highway Racer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030712; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #0f172a;
            box-shadow: 0 0 50px rgba(255, 51, 0, 0.4);
        }

        .company-banner {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; background: #0f172a;
            border-bottom: 2px solid #ff3300; text-align: center; padding: 6px 8px; z-index: 15;
        }

        .company-title {
            color: #ffaa00; font-weight: 900; font-size: 0.85rem; letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }

        .company-services { color: #38bdf8; font-size: 0.65rem; font-weight: 600; margin-top: 2px; }

        .hud {
            position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.95); color: #fff; font-weight: bold;
            z-index: 10; font-size: 0.8rem; border-bottom: 1px solid #334155;
        }

        .hud span { color: #f59e0b; font-size: 0.95rem; }

        .speed-slider { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: #cbd5e1; }
        .speed-slider input { width: 60px; cursor: pointer; }

        .controls-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            padding: 0 15px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }

        .steer-group, .pedal-group { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }

        .btn-steer {
            width: 58px; height: 58px; background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            color: white; font-size: 1.5rem; display: flex; align-items: center;
            justify-content: center; backdrop-filter: blur(8px); cursor: pointer; user-select: none;
        }
        .btn-steer:active { background: rgba(255, 51, 0, 0.6); }

        .pedal-btn {
            width: 52px; height: 80px; background: linear-gradient(180deg, #475569, #0f172a);
            border: 3px solid #94a3b8; border-radius: 10px; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: bold; cursor: pointer; user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .pedal-brake { border-color: #ef4444; color: #ef4444; }
        .pedal-brake:active { background: #ef444455; }

        .pedal-accel {
            height: 95px; background: linear-gradient(180deg, #0284c7, #0f172a);
            border-color: #38bdf8; color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .pedal-accel:active { background: #38bdf855; }

        .menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: white;
            padding: 20px; text-align: center;
        }

        .menu h1 { color: #ff3300; font-size: 1.8rem; text-shadow: 0 0 15px rgba(255,51,0,0.6); }
        .menu-subtitle { color: #ffaa00; font-size: 0.8rem; margin-bottom: 12px; font-weight: bold; }

        .garage {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; max-width: 360px; margin-bottom: 12px;
        }

        .v-card {
            background: #1e293b; border: 2px solid #334155; padding: 10px;
            border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }
        .v-card.active { border-color: #ff3300; background: #ff330022; color: #ff3300; }

        .photo-input-btn {
            background: #334155; border: 1px dashed #38bdf8;
            padding: 8px 15px; border-radius: 8px; color: #38bdf8; font-size: 0.75rem; cursor: pointer;
            margin-bottom: 12px;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff3300, #ffaa00); border: none;
            color: white; padding: 12px 40px; font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 51, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="company-banner">
        <div class="company-title">POWERED BY: ATAVA DIGITAL SERVICES & TRADING</div>
        <div class="company-services">Data Entry • Typing Works • Poster & Badge Design • Digital Services</div>
    </div>

    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>COINS: <span id="coins">0</span></div>
        <div class="speed-slider">
            SET SPD: <input type="range" id="speedAdjuster" min="6" max="24" value="12">
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-container">
        <div class="steer-group">
            <div class="btn-steer" id="leftBtn">◀</div>
            <div class="btn-steer" id="rightBtn">▶</div>
        </div>
        <div class="pedal-group">
            <div class="pedal-btn pedal-brake" id="brakeBtn">BRAKE</div>
            <div class="pedal-btn pedal-accel" id="accelBtn">GAS ⚡</div>
        </div>
    </div>

    <div class="menu" id="menu">
        <h1>ATAVA RACING ARENA</h1>
        <div class="menu-subtitle">POWERED BY ATAVA DIGITAL SERVICES & TRADING</div>

        <div class="garage">
            <div class="v-card active" onclick="selectVehicle('car', this)">🏎️ Hypercar Red</div>
            <div class="v-card" onclick="selectVehicle('yellowcar', this)">🏎️ GT Racer Yellow</div>
            <div class="v-card" onclick="selectVehicle('bike', this)">🏍️ Ninja Superbike</div>
            <div class="v-card" onclick="selectVehicle('tourerbike', this)">🏍️ Tourer Cruiser</div>
        </div>

        <label class="photo-input-btn">
            📷 Upload Custom Photo
            <input type="file" id="carPhotoInput" accept="image/*" style="display:none;">
        </label>

        <button class="start-btn" onclick="startGame()">START RACE 🚀</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight;

        let gameActive = false;
        let score = 0, coins = 0;
        let baseSpeed = 12;
        let currentSpeed = 12;
        let selectedType = 'car';
        let roadOffset = 0;
        let customCarImg = null;

        const lanes = [canvas.width * 0.22, canvas.width * 0.40, canvas.width * 0.60, canvas.width * 0.78];
        let playerLane = 1;
        const player = { x: lanes[playerLane], y: canvas.height - 160 };

        let traffic = [];
        let coinList = [];
        let popups = []; // Floating Text Animation Array
        let trees = [];

        // Audio Context for Coin Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        document.getElementById('speedAdjuster').addEventListener('input', (e) => {
            baseSpeed = parseInt(e.target.value);
            currentSpeed = baseSpeed;
        });

        function selectVehicle(type, el) {
            selectedType = type;
            customCarImg = null;
            document.querySelectorAll('.v-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        document.getElementById('carPhotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        customCarImg = img;
                        document.querySelectorAll('.v-card').forEach(c => c.classList.remove('active'));
                    };
                }
                reader.readAsDataURL(file);
            }
        });

        // Trees setup
        for (let i = 0; i < 6; i++) {
            trees.push({ x: 12, y: i * 140 });
            trees.push({ x: canvas.width - 12, y: i * 140 });
        }

        function drawTree(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#78350f'; ctx.fillRect(-3, 0, 6, 12);
            ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(0, -6, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(-2, -8, 8, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawRoad() {
            ctx.fillStyle = '#064e3b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const roadW = canvas.width * 0.72;
            const roadLeft = (canvas.width - roadW) / 2;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(roadLeft, 0, roadW, canvas.height);

            const stripeH = 30;
            for (let y = -stripeH + (roadOffset % stripeH); y < canvas.height; y += stripeH) {
                let c = (Math.floor((y - roadOffset) / stripeH) % 2 === 0) ? '#ef4444' : '#ffffff';
                ctx.fillStyle = c;
                ctx.fillRect(roadLeft - 6, y, 6, stripeH);
                ctx.fillRect(roadLeft + roadW, y, 6, stripeH);
            }

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);

            ctx.setLineDash([18, 18]);
            ctx.lineDashOffset = -roadOffset;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.31, 0); ctx.lineTo(canvas.width * 0.31, canvas.height);
            ctx.moveTo(canvas.width * 0.69, 0); ctx.lineTo(canvas.width * 0.69, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let t of trees) {
                t.y += currentSpeed;
                if (t.y > canvas.height + 20) t.y = -30;
                drawTree(t.x, t.y);
            }
        }

        function drawCarBody(x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#000'; ctx.fillRect(-22, -10, 5, 8); ctx.fillRect(17, -10, 5, 8);
            ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-18, -36, 36, 72, [10, 10, 6, 6]); ctx.fill();
            ctx.fillStyle = '#090d16'; ctx.beginPath(); ctx.roundRect(-13, -16, 26, 32, 5); ctx.fill();
            ctx.fillStyle = color; ctx.fillRect(-11, -4, 22, 14);
            ctx.fillStyle = '#000'; ctx.fillRect(-18, 28, 36, 5);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(-14, 33, 6, 3); ctx.fillRect(8, 33, 6, 3);
            ctx.restore();
        }

        function drawBikeRider(x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#000'; ctx.fillRect(-3, 12, 6, 20);
            ctx.fillStyle = color; ctx.fillRect(-7, -12, 14, 26);
            ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = color; ctx.fillRect(-12, -6, 24, 6);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, -5, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(-4, -8, 8, 3);
            ctx.restore();
        }

        function drawAtavaCoin(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('A', 0, 1);
            ctx.restore();
        }

        function drawPlayer() {
            player.x += (lanes[playerLane] - player.x) * 0.25;

            if (customCarImg) {
                ctx.drawImage(customCarImg, player.x - 22, player.y - 40, 44, 80);
            } else if (selectedType === 'car') {
                drawCarBody(player.x, player.y, '#dc2626');
            } else if (selectedType === 'yellowcar') {
                drawCarBody(player.x, player.y, '#eab308');
            } else if (selectedType === 'bike') {
                drawBikeRider(player.x, player.y, '#2563eb');
            } else {
                drawBikeRider(player.x, player.y, '#10b981');
            }
        }

        function spawnObjects() {
            if (traffic.length < 2 && Math.random() < 0.01) {
                let laneIdx = Math.floor(Math.random() * 4);
                let targetX = lanes[laneIdx];
                let safeToSpawn = true;

                for (let t of traffic) {
                    if (Math.abs(t.x - targetX) < 15 || t.y < 350) {
                        safeToSpawn = false;
                        break;
                    }
                }

                if (safeToSpawn) {
                    traffic.push({
                        x: targetX, y: -100,
                        color: ['#059669', '#d97706', '#2563eb', '#9333ea'][Math.floor(Math.random()*4)],
                        speed: 3 + Math.random() * 2
                    });
                }
            }

            if (Math.random() < 0.015) {
                let laneIdx = Math.floor(Math.random() * 4);
                coinList.push({ x: lanes[laneIdx], y: -50 });
            }
        }

        function updateGame() {
            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.y += currentSpeed - t.speed;
                drawCarBody(t.x, t.y, t.color);

                if (Math.abs(t.x - player.x) < 25 && Math.abs(t.y - player.y) < 45) gameOver();
                if (t.y > canvas.height + 100) traffic.splice(i, 1);
            }

            for (let i = coinList.length - 1; i >= 0; i--) {
                let coin = coinList[i];
                coin.y += currentSpeed;
                drawAtavaCoin(coin.x, coin.y);

                if (Math.abs(coin.x - player.x) < 22 && Math.abs(coin.y - player.y) < 30) {
                    coins += 10;
                    document.getElementById('coins').innerText = coins;
                    playCoinSound();
                    
                    // Trigger ATAVA Coin Popup Animation
                    popups.push({ x: coin.x - 30, y: coin.y, text: 'ATAVA +10', alpha: 1.2 });
                    
                    coinList.splice(i, 1);
                } else if (coin.y > canvas.height + 50) coinList.splice(i, 1);
            }

            // Draw Floating Coin Popups
            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i];
                p.y -= 1.5;
                p.alpha -= 0.03;
                ctx.fillStyle = `rgba(245, 158, 11, ${p.alpha})`;
                ctx.font = 'bold 16px Segoe UI';
                ctx.fillText(p.text, p.x, p.y);
                if (p.alpha <= 0) popups.splice(i, 1);
            }

            roadOffset += currentSpeed;
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameActive = true;
            score = 0; coins = 0; traffic = []; coinList = []; popups = [];
            if (audioCtx.state === 'suspended') audioCtx.resume();
            animate();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('menu').style.display = 'flex';
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            score += 0.2;
            document.getElementById('score').innerText = Math.floor(score);

            drawRoad();
            drawPlayer();
            spawnObjects();
            updateGame();

            requestAnimationFrame(animate);
        }

        document.getElementById('leftBtn').addEventListener('click', () => { if (playerLane > 0) playerLane--; });
        document.getElementById('rightBtn').addEventListener('click', () => { if (playerLane < 3) playerLane++; });

        const accelBtn = document.getElementById('accelBtn');
        const brakeBtn = document.getElementById('brakeBtn');

        // Gas Pedal
        accelBtn.addEventListener('mousedown', () => currentSpeed = baseSpeed * 1.8);
        accelBtn.addEventListener('mouseup', () => currentSpeed = baseSpeed);
        accelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); currentSpeed = baseSpeed * 1.8; });
        accelBtn.addEventListener('touchend', () => currentSpeed = baseSpeed);

        // Brake Pedal
        brakeBtn.addEventListener('mousedown', () => currentSpeed = baseSpeed * 0.2);
        brakeBtn.addEventListener('mouseup', () => currentSpeed = baseSpeed);
        brakeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); currentSpeed = baseSpeed * 0.2; });
        brakeBtn.addEventListener('touchend', () => currentSpeed = baseSpeed);

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && playerLane > 0) playerLane--;
            if (e.key === 'ArrowRight' && playerLane < 3) playerLane++;
            if (e.key === 'ArrowUp') currentSpeed = baseSpeed * 1.8;
            if (e.key === 'ArrowDown') currentSpeed = baseSpeed * 0.2;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') currentSpeed = baseSpeed;
        });
    </script>
</body>
</html>
