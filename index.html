<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATAVA 3D-Look Highway Racer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080c14; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #111;
            box-shadow: 0 0 35px rgba(255, 51, 0, 0.6);
        }

        .hud {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; padding: 12px 18px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.9); color: #fff; font-weight: bold;
            border-bottom: 3px solid #ff3300; z-index: 10; backdrop-filter: blur(10px);
        }

        .hud span { color: #f59e0b; font-size: 1.2rem; }

        /* Real Accelerator & Controls Pedals */
        .controls-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }

        .steer-group, .pedal-group {
            display: flex; gap: 12px; pointer-events: auto; align-items: flex-end;
        }

        .btn-steer {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            color: white; font-size: 1.8rem; display: flex; align-items: center;
            justify-content: center; backdrop-filter: blur(8px); cursor: pointer;
            user-select: none;
        }

        /* Pedals like the reference photo */
        .pedal-brake {
            width: 50px; height: 75px; background: linear-gradient(180deg, #475569, #1e293b);
            border: 3px solid #94a3b8; border-radius: 10px; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: bold; cursor: pointer; user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .pedal-accel {
            width: 55px; height: 95px; background: linear-gradient(180deg, #64748b, #0f172a);
            border: 3px solid #38bdf8; border-radius: 12px; color: #38bdf8;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold; cursor: pointer; user-select: none;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.97); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: white;
            padding: 20px; text-align: center;
        }

        .menu h1 { color: #ff3300; font-size: 2.2rem; text-shadow: 0 0 15px rgba(255,51,0,0.6); }
        .menu p { color: #94a3b8; margin-bottom: 25px; }

        .vehicle-select { display: flex; gap: 15px; margin-bottom: 25px; }

        .select-btn {
            background: #1e293b; border: 2px solid #334155; color: white;
            padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        .select-btn.active {
            border-color: #ff3300; background: #ff330022; color: #ff3300;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff3300, #ffaa00); border: none;
            color: white; padding: 16px 48px; font-size: 1.25rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 51, 0, 0.5);
        }

        .footer { margin-top: 35px; font-size: 0.85rem; color: #ffaa00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>COINS: <span id="coins">0</span></div>
        <div>SPEED: <span id="speedVal">120</span> KM/H</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-container">
        <div class="steer-group">
            <div class="btn-steer" id="leftBtn">◄</div>
            <div class="btn-steer" id="rightBtn">►</div>
        </div>
        <div class="pedal-group">
            <div class="pedal-brake" id="brakeBtn">BRAKE</div>
            <div class="pedal-accel" id="accelBtn">GAS</div>
        </div>
    </div>

    <div class="menu" id="menu">
        <h1 id="menuTitle">ATAVA RACING PRO</h1>
        <p>HD Exhaust Effects & Real Controls</p>
        
        <div class="vehicle-select">
            <button class="select-btn active" id="btnCar" onclick="setVehicle('car')">🏎️ HYPER CAR</button>
            <button class="select-btn" id="btnBike" onclick="setVehicle('bike')">🏍️ SUPERBIKE</button>
        </div>

        <button class="start-btn" onclick="startGame()">START RACE 🚀</button>
        <div class="footer">POWERED BY ATAVA DIGITAL SERVICES & TRADING</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight;

        let gameActive = false;
        let score = 0, coins = 0;
        let gameSpeed = 12;
        let isAccelerating = false;
        let selectedVehicle = 'car';
        let roadOffset = 0;

        const lanes = [
            canvas.width * 0.20,
            canvas.width * 0.40,
            canvas.width * 0.60,
            canvas.width * 0.80
        ];
        let playerLane = 1;

        const player = { x: lanes[playerLane], y: canvas.height - 160 };

        let traffic = [];
        let coinList = [];
        let particles = [];
        let popups = [];

        function setVehicle(type) {
            selectedVehicle = type;
            document.getElementById('btnCar').classList.toggle('active', type === 'car');
            document.getElementById('btnBike').classList.toggle('active', type === 'bike');
        }

        function drawRoad() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Red-White Rail
            const railW = 14, stripeH = 35;
            for (let y = -stripeH + (roadOffset % stripeH); y < canvas.height; y += stripeH) {
                ctx.fillStyle = (Math.floor((y - roadOffset) / stripeH) % 2 === 0) ? '#ef4444' : '#ffffff';
                ctx.fillRect(0, y, railW, stripeH);
                ctx.fillRect(canvas.width - railW, y, railW, stripeH);
            }

            // Yellow Center Double Line
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(canvas.width / 2 - 3, 0, 3, canvas.height);
            ctx.fillRect(canvas.width / 2 + 1, 0, 3, canvas.height);

            // Lane Divider Dashes
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.30, 0); ctx.lineTo(canvas.width * 0.30, canvas.height);
            ctx.moveTo(canvas.width * 0.70, 0); ctx.lineTo(canvas.width * 0.70, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawExhaustSmoke(x, y) {
            // Add smoke/fire particles
            particles.push({
                x: x + (Math.random() * 8 - 4),
                y: y + 35,
                size: Math.random() * 6 + 4,
                alpha: 1.0,
                color: isAccelerating ? '#38bdf8' : '#cbd5e1' // Blue Nitro Flame or Smoke
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.y += 3;
                p.alpha -= 0.04;
                p.size += 0.3;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawPlayer() {
            player.x += (lanes[playerLane] - player.x) * 0.25;

            ctx.save();
            ctx.translate(player.x, player.y);

            if (selectedVehicle === 'car') {
                // Hypercar (Matching Photo - Wide Body & Wing)
                ctx.fillStyle = '#dc2626'; // Bright Red
                ctx.beginPath();
                ctx.roundRect(-22, -38, 44, 76, 10);
                ctx.fill();

                // Carbon Roof / Windshield
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-17, -18, 34, 18);
                ctx.fillRect(-15, 12, 30, 8);

                // Big Rear Spoiler
                ctx.fillStyle = '#000000';
                ctx.fillRect(-26, 32, 52, 6);

                // Lights Glow
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-18, 36, 8, 3);
                ctx.fillRect(10, 36, 8, 3);

            } else {
                // Superbike
                ctx.fillStyle = '#000';
                ctx.fillRect(-4, -32, 8, 14);
                ctx.fillRect(-5, 20, 10, 16);

                ctx.fillStyle = '#8b5cf6'; // Purple / Blue Jacket Match
                ctx.beginPath();
                ctx.moveTo(0, -28); ctx.lineTo(11, -5); ctx.lineTo(8, 18);
                ctx.lineTo(-8, 18); ctx.lineTo(-11, -5);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#38bdf8'; // Blue Helmet
                ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();

            drawExhaustSmoke(player.x, player.y);
        }

        function drawTraffic(c) {
            ctx.save();
            ctx.translate(c.x, c.y);

            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.roundRect(-20, -35, 40, 70, 7);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-15, -10, 30, 22);

            ctx.restore();
        }

        function spawnObjects() {
            if (Math.random() < 0.02) {
                let laneIdx = Math.floor(Math.random() * 4);
                let targetX = lanes[laneIdx];

                let clearLane = true;
                for (let t of traffic) {
                    if (Math.abs(t.x - targetX) < 10 && t.y < 150) {
                        clearLane = false; break;
                    }
                }

                if (clearLane) {
                    traffic.push({
                        x: targetX, y: -100,
                        color: ['#eab308', '#2563eb', '#059669', '#d97706'][Math.floor(Math.random() * 4)],
                        speed: 4 + Math.random() * 2
                    });
                }
            }

            if (Math.random() < 0.015) {
                let laneIdx = Math.floor(Math.random() * 4);
                coinList.push({ x: lanes[laneIdx], y: -50 });
            }
        }

        function updateGame() {
            let currentSpeed = isAccelerating ? gameSpeed * 1.6 : gameSpeed;
            document.getElementById('speedVal').innerText = Math.floor(currentSpeed * 10);

            // Traffic
            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.y += currentSpeed - t.speed;
                drawTraffic(t);

                if (Math.abs(t.x - player.x) < 32 && Math.abs(t.y - player.y) < 60) {
                    gameOver();
                }

                if (t.y > canvas.height + 100) traffic.splice(i, 1);
            }

            // Coins
            for (let i = coinList.length - 1; i >= 0; i--) {
                let coin = coinList[i];
                coin.y += currentSpeed;

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, 11, 0, Math.PI*2); ctx.fill();

                if (Math.abs(coin.x - player.x) < 25 && Math.abs(coin.y - player.y) < 35) {
                    coins += 10;
                    document.getElementById('coins').innerText = coins;
                    popups.push({ x: player.x, y: player.y - 20, alpha: 1.0 });
                    coinList.splice(i, 1);
                } else if (coin.y > canvas.height + 50) {
                    coinList.splice(i, 1);
                }
            }

            // ATAVA Text Animations
            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i];
                p.y -= 2.5; p.alpha -= 0.03;
                ctx.fillStyle = `rgba(255, 204, 0, ${p.alpha})`;
                ctx.font = 'bold 20px Segoe UI';
                ctx.fillText('ATAVA +10', p.x - 40, p.y);
                if (p.alpha <= 0) popups.splice(i, 1);
            }

            roadOffset += currentSpeed;
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameActive = true;
            score = 0; coins = 0; traffic = []; coinList = []; particles = []; popups = [];
            animate();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('menuTitle').innerText = "CRASHED!";
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            score += 0.2;
            document.getElementById('score').innerText = Math.floor(score);

            drawRoad();
            drawPlayer();
            spawnObjects();
            updateGame();

            requestAnimationFrame(animate);
        }

        // Steering & Accelerator Controls
        const moveLeft = () => { if (playerLane > 0) playerLane--; };
        const moveRight = () => { if (playerLane < 3) playerLane++; };

        document.getElementById('leftBtn').addEventListener('click', moveLeft);
        document.getElementById('rightBtn').addEventListener('click', moveRight);

        const accelBtn = document.getElementById('accelBtn');
        const brakeBtn = document.getElementById('brakeBtn');

        accelBtn.addEventListener('mousedown', () => isAccelerating = true);
        accelBtn.addEventListener('mouseup', () => isAccelerating = false);
        accelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; });
        accelBtn.addEventListener('touchend', () => isAccelerating = false);

        brakeBtn.addEventListener('mousedown', () => gameSpeed = Math.max(5, gameSpeed - 3));
        brakeBtn.addEventListener('mouseup', () => gameSpeed = 12);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp') isAccelerating = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') isAccelerating = false;
        });
    </script>
</body>
</html>
