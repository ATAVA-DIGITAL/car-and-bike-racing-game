<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATAVA Digital Services - Highway Racer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030712; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #0f172a;
            box-shadow: 0 0 50px rgba(255, 51, 0, 0.4);
        }

        .company-banner {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; background: #0f172a;
            border-bottom: 2px solid #ff3300; text-align: center; padding: 6px 8px; z-index: 15;
        }

        .company-title {
            color: #ffaa00; font-weight: 900; font-size: 0.85rem; letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }

        .company-services { color: #38bdf8; font-size: 0.65rem; font-weight: 600; margin-top: 2px; }

        .hud {
            position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; padding: 6px 12px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.95); color: #fff; font-weight: bold;
            z-index: 10; font-size: 0.8rem; border-bottom: 1px solid #334155;
        }

        .hud span { color: #f59e0b; font-size: 0.95rem; }
        .stage-badge { background: #ff3300; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }

        .controls-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            padding: 0 15px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }

        .steer-group, .pedal-group { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }

        .btn-steer {
            width: 58px; height: 58px; background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            color: white; font-size: 1.5rem; display: flex; align-items: center;
            justify-content: center; backdrop-filter: blur(8px); cursor: pointer; user-select: none;
        }
        .btn-steer:active { background: rgba(255, 51, 0, 0.6); }

        .pedal-btn {
            width: 50px; height: 80px; background: linear-gradient(180deg, #475569, #0f172a);
            border: 3px solid #94a3b8; border-radius: 10px; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: bold; cursor: pointer; user-select: none;
        }

        .pedal-accel {
            height: 95px; background: linear-gradient(180deg, #0284c7, #0f172a);
            border-color: #38bdf8; color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; color: white;
            padding: 20px; text-align: center;
        }

        .menu h1 { color: #ff3300; font-size: 1.8rem; }

        .photo-input-btn {
            margin: 10px 0; background: #334155; border: 1px dashed #38bdf8;
            padding: 8px 15px; border-radius: 8px; color: #38bdf8; font-size: 0.75rem; cursor: pointer;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff3300, #ffaa00); border: none;
            color: white; padding: 12px 35px; font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="company-banner">
        <div class="company-title">POWERED BY: ATAVA DIGITAL SERVICES & TRADING</div>
        <div class="company-services">Data Entry • Typing Works • Poster & Badge Design • Digital Services</div>
    </div>

    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div class="stage-badge" id="stageBadge">STAGE 1</div>
        <div>COINS: <span id="coins">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-container">
        <div class="steer-group">
            <div class="btn-steer" id="leftBtn">◀</div>
            <div class="btn-steer" id="rightBtn">▶</div>
        </div>
        <div class="pedal-group">
            <div class="pedal-btn" id="brakeBtn">BRAKE</div>
            <div class="pedal-btn pedal-accel" id="accelBtn">GAS ⚡</div>
        </div>
    </div>

    <div class="menu" id="menu">
        <h1>ATAVA RACING ARENA</h1>
        <p style="color:#ffaa00; font-size:0.8rem; margin-top:5px;">Upload Custom Vehicle Photo:</p>
        
        <label class="photo-input-btn">
            📷 Upload Vehicle Image
            <input type="file" id="carPhotoInput" accept="image/*" style="display:none;">
        </label>

        <button class="start-btn" onclick="startGame()">START RACE 🚀</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight;

        let gameActive = false;
        let score = 0, coins = 0, stage = 1;
        let baseSpeed = 10;
        let currentSpeed = 10;
        let roadOffset = 0;
        let customCarImg = null;

        const stageColors = ['#064e3b', '#1e1b4b', '#701a75', '#450a0a']; // Stage Grass Colors

        const lanes = [canvas.width * 0.20, canvas.width * 0.40, canvas.width * 0.60, canvas.width * 0.80];
        let playerLane = 1;
        const player = { x: lanes[playerLane], y: canvas.height - 160 };

        let traffic = [];
        let coinList = [];
        let popups = [];

        // Upload custom car photo logic
        document.getElementById('carPhotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => customCarImg = img;
                }
                reader.readAsDataURL(file);
            }
        });

        function drawRoad() {
            ctx.fillStyle = stageColors[(stage - 1) % stageColors.length]; // Dynamic Stage Colors
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const roadW = canvas.width * 0.84;
            const roadLeft = (canvas.width - roadW) / 2;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(roadLeft, 0, roadW, canvas.height);

            const stripeH = 30;
            for (let y = -stripeH + (roadOffset % stripeH); y < canvas.height; y += stripeH) {
                let c = (Math.floor((y - roadOffset) / stripeH) % 2 === 0) ? '#ef4444' : '#ffffff';
                ctx.fillStyle = c;
                ctx.fillRect(roadLeft - 8, y, 8, stripeH);
                ctx.fillRect(roadLeft + roadW, y, 8, stripeH);
            }

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);

            ctx.setLineDash([18, 18]);
            ctx.lineDashOffset = -roadOffset;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.30, 0); ctx.lineTo(canvas.width * 0.30, canvas.height);
            ctx.moveTo(canvas.width * 0.70, 0); ctx.lineTo(canvas.width * 0.70, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayer() {
            player.x += (lanes[playerLane] - player.x) * 0.25;

            if (customCarImg) {
                ctx.drawImage(customCarImg, player.x - 25, player.y - 45, 50, 90);
            } else {
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.roundRect(player.x - 20, player.y - 38, 40, 76, 10); ctx.fill();
            }
        }

        // CONTROLLED REDUCED TRAFFIC SPAWN
        function spawnObjects() {
            if (Math.random() < 0.012) { // Traffic frequency reduced
                let laneIdx = Math.floor(Math.random() * 4);
                let targetX = lanes[laneIdx];
                let safeToSpawn = true;

                for (let t of traffic) {
                    if (Math.abs(t.x - targetX) < 20 && t.y < 350) { // Large safe gap
                        safeToSpawn = false;
                        break;
                    }
                }

                if (safeToSpawn) {
                    traffic.push({
                        x: targetX, y: -120,
                        color: ['#059669', '#d97706', '#2563eb'][Math.floor(Math.random()*3)],
                        speed: 3 + Math.random() * 2
                    });
                }
            }

            if (Math.random() < 0.015) {
                let laneIdx = Math.floor(Math.random() * 4);
                coinList.push({ x: lanes[laneIdx], y: -50 });
            }
        }

        function updateGame() {
            // Stage Progression Logic
            let currentStage = Math.floor(score / 500) + 1;
            if (currentStage !== stage) {
                stage = currentStage;
                document.getElementById('stageBadge').innerText = `STAGE ${stage}`;
                popups.push({ x: canvas.width/2 - 50, y: canvas.height/2, text: `STAGE ${stage}! 🚀`, alpha: 1.5 });
            }

            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.y += currentSpeed - t.speed;
                ctx.fillStyle = t.color;
                ctx.beginPath(); ctx.roundRect(t.x - 18, t.y - 35, 36, 70, 8); ctx.fill();

                if (Math.abs(t.x - player.x) < 28 && Math.abs(t.y - player.y) < 50) gameOver();
                if (t.y > canvas.height + 100) traffic.splice(i, 1);
            }

            for (let i = coinList.length - 1; i >= 0; i--) {
                let coin = coinList[i];
                coin.y += currentSpeed;
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, 12, 0, Math.PI*2); ctx.fill();

                if (Math.abs(coin.x - player.x) < 25 && Math.abs(coin.y - player.y) < 35) {
                    coins += 10;
                    document.getElementById('coins').innerText = coins;
                    coinList.splice(i, 1);
                } else if (coin.y > canvas.height + 50) coinList.splice(i, 1);
            }

            // Stage change Popups
            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i];
                p.y -= 1; p.alpha -= 0.02;
                ctx.fillStyle = `rgba(255, 204, 0, ${p.alpha})`;
                ctx.font = 'bold 24px Segoe UI';
                ctx.fillText(p.text, p.x, p.y);
                if (p.alpha <= 0) popups.splice(i, 1);
            }

            roadOffset += currentSpeed;
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameActive = true;
            score = 0; coins = 0; stage = 1; traffic = []; coinList = [];
            document.getElementById('stageBadge').innerText = `STAGE 1`;
            animate();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('menu').style.display = 'flex';
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            score += 0.2;
            document.getElementById('score').innerText = Math.floor(score);

            drawRoad();
            drawPlayer();
            spawnObjects();
            updateGame();

            requestAnimationFrame(animate);
        }

        document.getElementById('leftBtn').addEventListener('click', () => { if (playerLane > 0) playerLane--; });
        document.getElementById('rightBtn').addEventListener('click', () => { if (playerLane < 3) playerLane++; });

        const accelBtn = document.getElementById('accelBtn');
        accelBtn.addEventListener('mousedown', () => currentSpeed = baseSpeed * 1.8);
        accelBtn.addEventListener('mouseup', () => currentSpeed = baseSpeed);
        accelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); currentSpeed = baseSpeed * 1.8; });
        accelBtn.addEventListener('touchend', () => currentSpeed = baseSpeed);
    </script>
</body>
</html>
