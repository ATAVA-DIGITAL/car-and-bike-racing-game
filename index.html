<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATAVA Highway Racer</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a; user-select: none;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
        }

        .hud-header {
            background: rgba(0,0,0,0.6); padding: 12px 20px;
            color: #fff; font-weight: bold; display: flex;
            justify-content: space-around; border-bottom: 2px solid #ff3300;
        }

        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19; z-index: 20; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box; pointer-events: auto;
        }

        h1 { color: #ff3300; margin-bottom: 5px; text-align: center; }
        .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }

        /* Vehicle Card Selection */
        .card-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            width: 100%; max-width: 450px; margin-bottom: 20px;
        }

        .vehicle-card {
            background: #1e293b; border: 2px solid #334155; border-radius: 12px;
            padding: 10px; text-align: center; color: white; cursor: pointer;
            transition: 0.3s;
        }

        .vehicle-card.selected {
            border-color: #ff3300; background: #2b1215;
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.4);
        }

        .vehicle-card img {
            width: 100%; height: 70px; object-fit: contain; margin-bottom: 5px;
        }

        .card-title { font-weight: bold; font-size: 0.9rem; }
        .card-type { font-size: 0.75rem; color: #ffaa00; }

        .btn-start {
            background: linear-gradient(45deg, #ff3300, #ff8800); border: none;
            color: white; padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; width: 100%; max-width: 450px;
        }

        .controls {
            display: flex; justify-content: space-between; padding: 20px 40px;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 70px; height: 70px; background: rgba(255,255,255,0.2);
            border: 2px solid #fff; border-radius: 50%; color: white;
            font-size: 2rem; display: flex; align-items: center; justify-content: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="hud-header">
            <div>SCORE: <span id="score">0</span></div>
            <div>COINS: <span id="coins">0</span></div>
            <div>KM/H: <span id="speed">100</span></div>
        </div>

        <div class="controls">
            <div class="ctrl-btn" onclick="moveLeft()">🠈</div>
            <div class="ctrl-btn" onclick="moveRight()">🠊</div>
        </div>
    </div>

    <!-- Selection Cards -->
    <div id="menu" class="menu-screen">
        <h1>HIGHWAY SPEED RACER</h1>
        <div class="sub">Choose Your Ride</div>

        <div class="card-grid">
            <div class="vehicle-card selected" onclick="selectCard('thar', this)">
                <div class="card-title">Mahindra Thar</div>
                <div class="card-type">4x4 SUV</div>
            </div>
            <div class="vehicle-card" onclick="selectCard('scorpio', this)">
                <div class="card-title">Scorpio-N</div>
                <div class="card-type">Big SUV</div>
            </div>
            <div class="vehicle-card" onclick="selectCard('classic', this)">
                <div class="card-title">RE Classic 350</div>
                <div class="card-type">Bullet Bike</div>
            </div>
            <div class="vehicle-card" onclick="selectCard('mt15', this)">
                <div class="card-title">Yamaha MT-15</div>
                <div class="card-type">Sports Bike</div>
            </div>
        </div>

        <button class="btn-start" onclick="startGame()">START RACE 🚀</button>
    </div>

    <script>
        let scene, camera, renderer, player;
        let selectedVehicle = 'thar';
        let currentLane = 1;
        const lanes = [-3, -1, 1, 3];

        function selectCard(type, el) {
            selectedVehicle = type;
            document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(0, 10, 10);
            scene.add(light);

            createRoad();
        }

        function createRoad() {
            const roadGeo = new THREE.PlaneGeometry(10, 200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);
        }

        function buildDetailedVehicle(type) {
            if(player) scene.remove(player);
            player = new THREE.Group();

            if(type === 'classic' || type === 'mt15') {
                // Bike Structure (Sleek Shape)
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.8, 1.8),
                    new THREE.MeshStandardMaterial({ color: type === 'mt15' ? 0x0066ff : 0x004411 })
                );
                body.position.y = 0.5;
                player.add(body);
            } else {
                // Car/SUV Structure (Layered 3D)
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(1.6, 0.8, 3.0),
                    new THREE.MeshStandardMaterial({ color: type === 'thar' ? 0xcc0000 : 0x111111 })
                );
                base.position.y = 0.5;

                const top = new THREE.Mesh(
                    new THREE.BoxGeometry(1.4, 0.7, 1.6),
                    new THREE.MeshStandardMaterial({ color: 0x222222 })
                );
                top.position.set(0, 1.1, -0.2);

                player.add(base);
                player.add(top);
            }

            player.position.x = lanes[currentLane];
            scene.add(player);
            camera.lookAt(player.position);
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            buildDetailedVehicle(selectedVehicle);
        }

        function moveLeft() { if(currentLane > 0) { currentLane--; player.position.x = lanes[currentLane]; } }
        function moveRight() { if(currentLane < 3) { currentLane++; player.position.x = lanes[currentLane]; } }

        init();
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
